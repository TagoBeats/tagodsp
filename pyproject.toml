[project]
name = "tagodsp"
version = "0.1.0"
description = "Personal DSP library: Python workbench + header-only C++ core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robin Busse" }]
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "scipy>=1.12",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tagodsp"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "NPY"]
