[project]
name = "tagodsp"
version = "0.1.0"
description = "Personal DSP library: Python workbench + header-only C++ core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robin Busse" }]
dependencies = [
    "numpy>=1.26",
    "python-stretch",
    "scipy>=1.12",
]

[project.optional-dependencies]
voicing = ["librosa>=0.10"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "librosa>=0.10",
    "numba>=0.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tagodsp"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
src = ["python"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "NPY"]

[tool.uv.workspace]
members = [
    "third_party/python-stretch",
]

[tool.uv.sources]
python-stretch = { workspace = true }
